# Wöchentliche Updates der npm-Pakete (Minor/Patch gebündelt) und monatlich der GitHub Actions.
# Major-Versionen kommen einzeln, damit Breaking Changes getrennt geprüft werden.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      minor-und-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      timezone: Europe/Berlin
    commit-message:
      prefix: ci
